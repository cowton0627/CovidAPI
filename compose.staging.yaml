services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_ACCESS_TOKEN: ${BACKEND_ACCESS_TOKEN:?set BACKEND_ACCESS_TOKEN}
      DATABASE_PATH: /data/notification-backend.sqlite3
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - notification_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "backend.notification_backend", "worker"]
    environment:
      DATABASE_PATH: /data/notification-backend.sqlite3
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
      PUSH_DISPATCH_ENABLED: "false"
    volumes:
      - notification_data:/data

volumes:
  notification_data:
