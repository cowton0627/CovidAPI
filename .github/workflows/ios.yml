name: iOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Validate notification API contract
        run: ruby scripts/validate_notification_contract.rb
      - name: Create iOS Simulator
        id: simulator
        run: |
          runtime_id="$(xcrun simctl list runtimes --json | jq -r '
            [.runtimes[] | select(.isAvailable and (.name | startswith("iOS")))]
            | sort_by(.version | split(".") | map(tonumber))
            | last
            | .identifier
          ')"
          device_type_id="$(xcrun simctl list devicetypes --json | jq -r '
            [.devicetypes[] | select(.name == "iPhone 16")]
            | first
            | .identifier
          ')"

          if [[ -z "$runtime_id" || "$runtime_id" == "null" ]]; then
            echo "No available iOS Simulator runtime was found."
            xcrun simctl list runtimes
            exit 1
          fi

          if [[ -z "$device_type_id" || "$device_type_id" == "null" ]]; then
            echo "The iPhone 16 Simulator device type is unavailable."
            xcrun simctl list devicetypes
            exit 1
          fi

          simulator_id="$(xcrun simctl create "CI iPhone" "$device_type_id" "$runtime_id")"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild test \
            -project CovidAPI/CovidAPI.xcodeproj \
            -scheme CovidAPI \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            CODE_SIGNING_ALLOWED=NO
